# PostgreSQL 16 para desarrollo. Puerto 5433 para no chocar con otro PostgreSQL local (B51).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: alas
      POSTGRES_PASSWORD: alas
      POSTGRES_DB: alas_de_senas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alas -d alas_de_senas"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
