# Entorno de entrenamiento (proyecto aparte, excluido del workspace raíz).
# Versiones verificadas el 30/10/2026: instalación limpia con uv, conversión a TensorFlow.js
# y carga con @tensorflow/tfjs 4.22.0 (salidas idénticas a 4 decimales). Ver D-003.
[project]
name = "alas-ml"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "tensorflow==2.15.1",        # Keras 2 (el conversor de tfjs falla con Keras 3)
  "tensorflowjs==4.22.0",      # misma versión que @tensorflow/tfjs del frontend
  "numpy>=1.26,<2",            # TF 2.15 no soporta NumPy 2
  "scikit-learn>=1.4,<1.6",
  "matplotlib>=3.8,<3.10",
  "setuptools<81",             # tensorflowjs → tensorflow_hub importa pkg_resources (B74)
]

[tool.uv]
package = false
