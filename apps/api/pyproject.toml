[project]
name = "alas-api"
version = "0.1.0"
description = "API, dominio, contenido y CLI de Alas de Señas"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "slowapi>=0.1.9",
    "tzdata>=2024.2",
    "typer>=0.15",
    "pyyaml>=6.0",
    "imageio-ffmpeg>=0.5",
    "pillow>=11.0",
]

[project.scripts]
alas = "app.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pytest-playwright>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
