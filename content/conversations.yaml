# Conversaciones de 2–3 turnos (§6.5). Cada turno: la Persona A muestra `prompt` y el usuario
# elige `answer` entre 3 clips (answer + distractors).
# Reglas: solo señas de este nodo o de nodos anteriores; la primera conversación de 2 turnos debe
# usar solo señas de L1–L2 del nodo (o anteriores); una seña nunca se responde con ella misma ni
# aparece entre sus propias opciones (D-008).
# Todas son una PROPUESTA del equipo de desarrollo: revisar con el intérprete.
# Los nodos ALPHABET no tienen conversaciones: usan `spelling` (palabras en MAYÚSCULAS, sin tildes).

M1-N1:
  - turns:  # revisar
      - prompt: hola
        answer: buenos-dias
        distractors: [adios, buenas-noches]
      - prompt: adios
        answer: buenas-noches
        distractors: [hola, como-estas]
  - turns:  # revisar
      - prompt: hola
        answer: buenas-tardes
        distractors: [adios, gracias]
      - prompt: gracias
        answer: de-nada
        distractors: [por-favor, hola]
      - prompt: adios
        answer: buenas-noches
        distractors: [como-estas, por-favor]

